[package]
name = "bilidesk"
version = "0.1.0"
description = "Unofficial Bilibili desktop client for personal use"
authors = ["BiliDesk"]
edition = "2021"

[lib]
name = "bilidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "deflate", "brotli", "rustls-tls"] }
thiserror = "2"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
